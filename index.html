<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ASIAX OWNER - Mobile UI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

  <style>
    :root {
      --bg: #0a0e1a; --card: rgba(20, 30, 50, 0.8); --glass: rgba(255,255,255,0.05);
      --accent: #00d4ff; --success: #00ff88; --warning: #ffaa00; --error: #ff4757; --muted: #a0b0c0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; font-family:'Inter',system-ui,sans-serif; }
    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 50%, #0a0e1a 100%);
      color: #e8f0ff; padding-bottom: 20px; overflow-x: hidden;
    }
    .app { max-width: 420px; margin: 0 auto; padding: 16px; }
    
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; margin-bottom: 16px; backdrop-filter: blur(20px);
      background: rgba(10,14,26,0.8); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .custom-logo { width: 120px; height: 48px; object-fit: contain; }
    
    .status {
      padding: 12px; border-radius: 12px; text-align: center; font-size: 0.85rem; font-weight: 500;
      background: var(--glass); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px;
    }
    .status.success { background: rgba(0,255,136,0.1); color: var(--success); border-color: var(--success); }
    .status.error { background: rgba(255,71,87,0.1); color: var(--error); border-color: var(--error); }
    
    .card-app {
      background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
      padding: 20px; margin-bottom: 16px; backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3); animation: float 6s ease-in-out infinite;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    
    .btn-modern {
      border-radius: 16px; padding: 14px 20px; font-weight: 600; border: none; transition: all 0.3s;
      min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #00ff88); color: #000; }
    .btn-warning { background: linear-gradient(135deg, var(--warning), #ff8800); color: #000; }
    .btn-modern:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.4); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    
    .btn-home {
      background: linear-gradient(135deg, var(--accent), #00ff88); color: #000;
      border-radius: 12px; padding: 8px 16px; font-size: 0.85rem; font-weight: 600;
      min-height: auto; min-width: 70px; white-space: nowrap;
    }
    
    .form-control {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      color: #fff; height: 48px; padding: 12px 16px; transition: all 0.3s;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.2); outline: none; }
    .form-control::placeholder { color: var(--muted); }
    
    .price-card { text-align: center; font-size: 1.2rem; font-weight: 700; color: var(--accent); margin: 16px 0; }
    
    .stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat {
      flex: 1; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.02);display: flex; flex-direction: column; gap: 6px; min-width: 120px; border: 1px solid rgba(255,255,255,0.05);
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .stat-value { font-size: 1rem; font-weight: 700; color: var(--accent); }
    
    .contract-info { font-size: 0.75rem; color: var(--success); word-break: break-all; }
    
    @media (max-width: 360px) { 
      .app { padding: 12px; } 
      .card-app { padding: 16px; } 
      .stats-row { gap: 8px; }
      .stat { padding: 10px; min-width: 100px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <img src="prologo.png" class="custom-logo" alt="ASIAX" />
      </div>
      <button id="connectBtn" class="btn btn-modern btn-primary">
        <i class="fas fa-wallet"></i> <span id="connectLabel">Connect</span>
      </button>
    </div>

    <div id="status" class="status">Ready — Connect Owner Wallet</div>

    <div class="card-app">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div style="flex: 1;">
          <div style="color: var(--muted); font-size: 0.8rem;">Owner Address</div>
          <div id="userAddress" style="font-weight:700;font-size:1.1rem">Not Connected</div>
        </div>
        <button id="backHome" class="btn-home" style="display:none;">
          <i class="fas fa-home"></i> Home
        </button>
      </div>
    </div>

    <!-- ✅ CONTRACT INFO CARDS -->
    <div class="card-app">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div><div style="color: var(--muted); font-size: 0.8rem;">Contract Info</div><div style="font-weight:700">Dashboard</div></div>
        <i class="fas fa-chart-bar" style="font-size:1.5rem;color:var(--accent)"></i>
      </div>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-label">Current Price</div>
          <div class="stat-value" id="currentPrice">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Contract AsiaX</div>
          <div class="stat-value" id="contractAsiaX">0.00</div>
        </div>
        <div class="stat">
          <div class="stat-label">USDT Receiver</div>
          <div class="stat-value" id="receiverAddr">None</div>
        </div>
      </div>
    </div>

    <div id="currentInfo" class="price-card">Loading Price...</div>

    <div class="card-app">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div><div style="color: var(--muted); font-size: 0.8rem;">Send AsiaX</div><div style="font-weight:700">To Contract</div></div>
        <i class="fas fa-paper-plane" style="font-size:1.5rem;color:var(--accent)"></i>
      </div>
      <input id="asiaxAmount" type="number" class="form-control" placeholder="AsiaX Amount (100)" min="1">
      <button id="sendAsiaX" class="btn btn-modern btn-warning w-100 mt-3" disabled>📤 Send AsiaX</button>
    </div>

    <div class="card-app">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div><div style="color: var(--muted); font-size: 0.8rem;">Set Price</div><div style="font-weight:700">Human Rate</div></div>
        <i class="fas fa-dollar-sign" style="font-size:1.5rem;color:var(--accent)"></i>
      </div>
      <input id="humanRate" type="number" class="form-control" placeholder="1 USDT = ? (2)" min="1">
      <button id="setPrice" class="btn btn-modern btn-warning w-100 mt-3" disabled>💰 Set Price</button>
    </div>

    <div class="card-app">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div><div style="color: var(--muted); font-size: 0.8rem;">Set Receiver</div><div style="font-weight:700">USDT Address</div></div><i class="fas fa-user" style="font-size:1.5rem;color:var(--accent)"></i>
      </div>
      <input id="receiverAddress" type="text" class="form-control" placeholder="Receiver Address">
      <button id="setReceiver" class="btn btn-modern btn-warning w-100 mt-3" disabled>🏦 Set Receiver</button>
    </div>
  </div>

  <script>
    // 🚨 YE 2 LINES BADALO!
    const CONTRACT_ADDR = '0xCA275a92B4845f3caD2995FaeC00733849C4e6D1';
    const ASIAX_ADDR = '0xe36b5223d488322fac2ddda937e5ab226e83fbbd';

    const abi = [
      "function setPrice(uint256 _humanRate) external",
      "function setReceiver(address _receiver) external",
      "function getHumanPrice() view returns(uint256)",
      "function owner() view returns(address)",
      "function getReceiver() view returns(address)",
      "function getAsiaXBalance() view returns(uint256)"
    ];
    const erc20 = [
      "function transfer(address,uint256)", 
      "function decimals() view returns(uint8)", 
      "function balanceOf(address) view returns(uint256)"
    ];

    let wallet, contract, asiaxContract;

    function roundTo2Decimals(num) {
      return parseFloat(num).toFixed(2);
    }

    document.getElementById('connectBtn').onclick = async () => {
      if (window.ethereum) {
        try {
          await window.ethereum.enable();
          const provider = new ethers.providers.Web3Provider(window.ethereum);
          const signer = provider.getSigner();
          wallet = await signer.getAddress();
          
          contract = new ethers.Contract(CONTRACT_ADDR, abi, signer);
          asiaxContract = new ethers.Contract(ASIAX_ADDR, erc20, signer);
          
          const owner = await contract.owner();
          if (wallet.toLowerCase() !== owner.toLowerCase()) {
            alert('❌ YE OWNER WALLET NHI HAI!');
            return;
          }
          
          document.getElementById('userAddress').innerHTML = wallet.substring(0,6) + '...' + wallet.substring(38);
          document.getElementById('connectLabel').innerHTML = 'Connected';
          document.getElementById('connectBtn').disabled = true;
          document.getElementById('backHome').style.display = 'block';
          
          await loadContractInfo();
          document.querySelectorAll('button[disabled]').forEach(b => b.disabled = false);
          
          document.getElementById('status').innerHTML = '✅ Owner Connected!';
          document.getElementById('status').className = 'status success';
        } catch(e) {
          document.getElementById('status').innerHTML = '❌ ' + e.message;
          document.getElementById('status').className = 'status error';
        }
      } else {
        alert('MetaMask install karo!');
      }
    };

    async function loadContractInfo() {
      try {
        // Price
        const price = await contract.getHumanPrice();
        document.getElementById('currentPrice').innerHTML = price;
        document.getElementById('currentInfo').innerHTML = '💰 1 USDT = ' + price + ' AsiaX';
        
        // Contract AsiaX
        const contractBalRaw = await contract.getAsiaXBalance();
        const contractBal = ethers.utils.formatUnits(contractBalRaw, 18);
        document.getElementById('contractAsiaX').innerHTML = roundTo2Decimals(contractBal);
        
        // Receiver
        const receiver = await contract.getReceiver();
        if (receiver === '0x0000000000000000000000000000000000000000') {
          document.getElementById('receiverAddr').innerHTML = 'None';
        } else {
          document.getElementById('receiverAddr').innerHTML = receiver.substring(0,6) + '...';
        }
      } catch(e) {
        console.log('Contract info error:', e);
      }
    }

    document.getElementById('sendAsiaX').onclick = async () => {
      document.getElementById('status').innerHTML = '⏳ Sending...';try {
        const amt = document.getElementById('asiaxAmount').value;
        const dec = await asiaxContract.decimals();
        const units = ethers.utils.parseUnits(amt, dec);
        const tx = await asiaxContract.transfer(CONTRACT_ADDR, units);
        await tx.wait();
        document.getElementById('status').innerHTML = '✅ Sent!';
        document.getElementById('status').className = 'status success';
        await loadContractInfo();
      } catch(e) {
        document.getElementById('status').innerHTML = '❌ ' + e.message;
        document.getElementById('status').className = 'status error';
      }
    };

    document.getElementById('setPrice').onclick = async () => {
      document.getElementById('status').innerHTML = '⏳ Setting...';
      try {
        const rate = document.getElementById('humanRate').value;
        const tx = await contract.setPrice(rate);
        await tx.wait();
        document.getElementById('status').innerHTML = '✅ Price Set!';
        document.getElementById('status').className = 'status success';
        await loadContractInfo();
      } catch(e) {
        document.getElementById('status').innerHTML = '❌ ' + e.message;
        document.getElementById('status').className = 'status error';
      }
    };

    document.getElementById('setReceiver').onclick = async () => {
      document.getElementById('status').innerHTML = '⏳ Setting...';
      try {
        const addr = document.getElementById('receiverAddress').value;
        const tx = await contract.setReceiver(addr);
        await tx.wait();
        document.getElementById('status').innerHTML = '✅ Receiver Set!';
        document.getElementById('status').className = 'status success';
        await loadContractInfo();
      } catch(e) {
        document.getElementById('status').innerHTML = '❌ ' + e.message;
        document.getElementById('status').className = 'status error';
      }
    };

    document.getElementById('backHome').onclick = () => {
      window.location.href = 'index.html'; // YE BADALO!
    };
  </script>
</body>
</html>
